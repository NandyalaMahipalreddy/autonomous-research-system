version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    stdin_open: true

    depends_on:
      - backend

  redis:
    image: redis:latest

    container_name: redis-server

    ports:
      - "6379:6379"